name: Update Market Snapshot

on:
  schedule:
    - cron: '50 11 * * 1-5'
  workflow_dispatch:

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install requests yfinance
      - name: Update snapshot
        env:
          AV_KEY: ${{ secrets.AV_KEY }}
        run: python .github/scripts/update_snapshot.py
      - name: Update ETF forward P/E history
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.AV_KEY }}
        run: node .github/scripts/update-forward-pe-history.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-data-snapshot.json forward-pe-history.json
          git diff --cached --quiet || git commit -m "chore: update market snapshot $(date -u +%Y-%m-%d)" && git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the updated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v5
